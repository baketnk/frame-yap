name: Installer and release packaging
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check installer parity and release packaging offline
        run: python3 -m unittest discover -s tests -p test_installer.py
